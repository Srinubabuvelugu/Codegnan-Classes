{% extends "base.html" %}

{% block title %}Login | ShopZone{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="card-body">

            <!-- Header -->
            <div class="text-center mb-4">

                <div class="auth-logo">
                    <i class="bi bi-person"></i>
                </div>

                <h2 class="auth-title">
                    Welcome Back
                </h2>

                <p class="auth-subtitle">
                    Login to your ShopZone account
                </p>

            </div>


            <!-- Login Form -->
            <form method="POST"
                  action="{{ url_for('login') }}">

                <!-- Email -->
                <div class="mb-3">

                    <label for="email"
                           class="form-label">
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="password"
                           class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    </div>

                </div>


                <!-- Remember + Forgot -->
                <div class="d-flex justify-content-between
                            align-items-center mb-4">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="remember"
                            name="remember">

                        <label class="form-check-label"
                               for="remember">
                            Remember me
                        </label>

                    </div>

                    <a href="#"
                       class="text-primary text-decoration-none">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn auth-btn text-white w-100">

                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Login

                </button>

            </form>


            <!-- Register -->
            <div class="text-center mt-4">

                <span class="text-muted">
                    Don't have an account?
                </span>

                <a href="{{ url_for('register') }}"
                   class="fw-semibold text-primary text-decoration-none">

                    Register

                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
