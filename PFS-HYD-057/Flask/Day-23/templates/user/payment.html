{% extends "base.html" %}

{% block title %}Payment | ShopZone{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/user.css') }}">
{% endblock %}

{% block content %}

<div class="container">

    <div class="payment-page">

        <div class="payment-card">

            <h1>Complete Payment</h1>

            <p>
                Your order is ready for payment.
            </p>

            <div class="payment-amount">

                <span>Amount to Pay</span>

                <strong>
                    ₹{{ amount }}
                </strong>

            </div>

            <button
                type="button"
                id="pay-button"
                class="btn btn-primary"
            >
                Pay with Razorpay
            </button>

            <form method="POST" action="{{ url_for('payment_cancel') }}" style="margin-top: 12px;">
                <button type="submit" class="payment-back" style="border:0;background:none;cursor:pointer;">
                    Cancel Payment &amp; Return to Cart
                </button>
            </form>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

    const options = {

        key: "{{ razorpay_key_id }}",

        amount: "{{ razorpay_order.amount }}",

        currency: "{{ razorpay_order.currency }}",

        name: "ShopZone",

        description: "ShopZone Order Payment",

        order_id: "{{ razorpay_order.id }}",

        handler: function (response) {

            const form = document.createElement("form");

            form.method = "POST";
            form.action = "{{ url_for('verify_payment') }}";

            const paymentId = document.createElement("input");
            paymentId.type = "hidden";
            paymentId.name = "razorpay_payment_id";
            paymentId.value = response.razorpay_payment_id;

            const orderId = document.createElement("input");
            orderId.type = "hidden";
            orderId.name = "razorpay_order_id";
            orderId.value = response.razorpay_order_id;

            const signature = document.createElement("input");
            signature.type = "hidden";
            signature.name = "razorpay_signature";
            signature.value = response.razorpay_signature;

            form.appendChild(paymentId);
            form.appendChild(orderId);
            form.appendChild(signature);

            document.body.appendChild(form);

            form.submit();
        },

        prefill: {
            name: "{{ user.username }}",
            email: "{{ user.email }}",
            contact: "{{ user.phone }}"
        },

        theme: {
            color: "#2563eb"
        }

    };


    const razorpay = new Razorpay(options);

    razorpay.on("payment.failed", function (response) {
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "{{ url_for('payment_failed') }}";

        const orderId = document.createElement("input");
        orderId.type = "hidden";
        orderId.name = "order_id";
        orderId.value = "{{ razorpay_order.id }}";

        const reason = document.createElement("input");
        reason.type = "hidden";
        reason.name = "reason";
        reason.value = (response.error && response.error.description) || "Razorpay payment failed";

        form.appendChild(orderId);
        form.appendChild(reason);
        document.body.appendChild(form);
        form.submit();
    });


    document.getElementById("pay-button").onclick = function () {

        razorpay.open();

    };

</script>

{% endblock %}
