<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        SNS
        {% endblock %}
    </title>
    {% block style %}
    {% endblock %}
</head>
<body style="margin: auto; padding: 30px 0px 20px 0px;">
    <div style="text-align: right;">
        {% block navmenu %}
        {% endblock %}

    </div>

    <div>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div style="color: rgb(246, 170, 56); background-color: antiquewhite;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}
    </div>

    

    {% block content %}
    {% endblock %}

    <footer style="text-align: center;">
        <div>
            <div>
                SNS App | Codegnan
            </div>
            <div>
                Srinubabu
            </div>
        </div>
    </footer>
    
</body>
</html>
