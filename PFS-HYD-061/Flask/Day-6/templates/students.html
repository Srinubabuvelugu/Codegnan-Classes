<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM</title>
</head>
<body>
    <div>
        <div>
            <h3>Students</h3>
        </div>
        <div>
            <form action="">
                <label for="">Search</label>
                <input type="number" name="class" id="" placeholder="Enter class">

                <button type="submit">search</button>
                <button><a href="/students">Remove Filter</a></button>
            </form>
        </div>
        <div>
            <table>
                <tr>
                
                    <th>ID</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Action</th>
                </tr>
                
            {% for id in students %}
                <tr>
                    <td>{{ id }}</td>
                    <td>{{ students[id]['name'] }}</td>
                    <td>{{ students[id]['class'] }}</td>
                    <td><a href="/students/{{ id }}">view</a></td>
                </tr>
            {% endfor %}

            </table>

        </div>
    </div>
    
</body>
</html>
