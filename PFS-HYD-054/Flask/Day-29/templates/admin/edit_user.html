{% extends "admin/base.html" %}

{% block title %}Edit User | ShopZone Admin{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit User</h1>
        <p>Update user information</p>
    </div>

    <a href="{{ url_for('admin_user_details', user_id=user.id) }}" class="btn btn-secondary">
        Back
    </a>
</div>

<div class="form-card">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ user.name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ user.phone }}"
                >
            </div>

            <div class="form-group">
                <label for="role">Role</label>

                <select id="role" name="role" required>
                    <option value="USER"
                        {% if user.role == 'USER' %}selected{% endif %}>
                        User
                    </option>

                    <option value="ADMIN"
                        {% if user.role == 'ADMIN' %}selected{% endif %}>
                        Admin
                    </option>
                </select>
            </div>

        </div>

        <div class="form-section">
            <h3>Address</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                    >{{ user.address }}</textarea>
                </div>

                <div class="form-group">
                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        value="{{ user.city }}"
                    >
                </div>

                <div class="form-group">
                    <label for="state">State</label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        value="{{ user.state }}"
                    >
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode</label>

                    <input
                        type="text"
                        id="pincode"
                        name="pincode"
                        value="{{ user.pincode }}"
                    >
                </div>

            </div>
        </div>

        <div class="form-actions">

            <a
                href="{{ url_for('admin_user_details', user_id=user.id) }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Update User
            </button>

        </div>

    </form>

</div>

{% endblock %}
