{% extends "base.html" %}

{% block title %}Register | ShopZone{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="card-body">

            <!-- Header -->
            <div class="text-center mb-4">

                <div class="auth-logo">
                    <i class="bi bi-person-plus"></i>
                </div>

                <h2 class="auth-title">
                    Create Account
                </h2>

                <p class="auth-subtitle">
                    Join ShopZone and start shopping
                </p>

            </div>


            <!-- Register Form -->
            <form method="POST"
                  action="{{ url_for('register') }}">

                <!-- Full Name -->
                <div class="mb-3">

                    <label for="name"
                           class="form-label">
                        Full Name
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="form-control"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label for="email"
                           class="form-label">
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <!-- Phone -->
                <div class="mb-3">

                    <label for="phone"
                           class="form-label">
                        Phone Number
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-telephone"></i>
                        </span>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                            autocomplete="tel">

                    </div>

                </div>


                <!-- Password Row -->
                <div class="row">

                    <!-- Password -->
                    <div class="col-md-6 mb-3">

                        <label for="password"
                               class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Password"
                                autocomplete="new-password"
                                required>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div class="col-md-6 mb-3">

                        <label for="confirm_password"
                               class="form-label">
                            Confirm Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required>

                        </div>

                    </div>

                </div>


                <!-- Terms -->
                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>

                    <label class="form-check-label"
                           for="terms">

                        I agree to the

                        <a href="#"
                           class="text-primary text-decoration-none">
                            Terms & Conditions
                        </a>

                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="btn auth-btn text-white w-100">

                    <i class="bi bi-person-plus me-1"></i>
                    Create Account

                </button>

            </form>


            <!-- Login -->
            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a href="{{ url_for('login') }}"
                   class="fw-semibold text-primary text-decoration-none">

                    Login

                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
